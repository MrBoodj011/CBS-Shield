[workspace]
resolver = "2"
members = [
    "crates/cbs-core",
    "crates/cbs-store",
    "crates/cbs-quarantine",
    "crates/cbs-netmon",
    "crates/cbs-firewall",
    "src-tauri",
]

[workspace.package]
version = "0.4.0-dev"
edition = "2021"
authors = ["Cybrense"]
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "io-util",
    "sync",
    "time",
    "fs",
] }
rusqlite = { version = "0.41", features = ["bundled"] }

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
