[package]
name = "cbs-shield"
description = "CBS Shield — open source manual security scanner for Windows (Cybrense)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
default-run = "cbs-shield"

[lib]
name = "cbs_shield_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "cbs-shield"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
cbs-core = { path = "../crates/cbs-core" }
cbs-store = { path = "../crates/cbs-store" }
cbs-quarantine = { path = "../crates/cbs-quarantine" }
cbs-netmon = { path = "../crates/cbs-netmon" }
cbs-firewall = { path = "../crates/cbs-firewall" }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
sha2.workspace = true
tokio.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile = "3"
